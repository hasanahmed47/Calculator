<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <link rel="stylesheet" href="style.css">
   <link rel="shortcut icon" href="image/calculator.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>
<body>
   
      <div class="cal">
        <div class="display">
            <input readonly id="input" placeholder="0">
        </div>
<div class="keys">
 <button class="butt action"    onclick="remove()">AC</button>
<button  class="butt action"  onclick="deletee()">DEL</button>
<button  class="butt operator"  onclick="append('%')">%</button>
<button  class="butt operator"  onclick="append('/')">/</button>

<button  class="butt "  onclick="append('7')">7</button>
<button  class="butt "  onclick="append('8')">8</button>
<button  class="butt "  onclick="append('9')">9</button>
<button  class="butt operator"  onclick="append('*')">*</button>

<button  class="butt "  onclick="append('4')">4</button>
<button  class="butt "  onclick="append('5')">5</button>
<button  class="butt "  onclick="append('6')">6</button>
<button  class="butt operator"  onclick="append('-')">-</button>

<button  class="butt"  onclick="append('1')">1</button>
<button  class="butt"  onclick="append('2')">2</button>
<button  class="butt"  onclick="append('3')">3</button>
<button  class="butt operator"  onclick="append('+')">+</button>

<button  class="butt "  onclick="append('0')">0</button>
<button  class="butt operator"  onclick="append('.')">.</button>
<button  class="butt ans"  onclick="calculating()">=</button>

</div>      
          
      </div>
    
    <script src="app.js"></script>
   
</body>
</html>
