<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <link rel="stylesheet" href="style.css">
   <link rel="shortcut icon" href="image/calculator.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>
<body>
      <div class="cal">
       <div class="display">
      <input readonly id="input" placeholder="0">
      </div>
<div class="keys">
 <button class="action">AC</button>
<button  class="action">DEL</button>
<button  class="operator">%</button>
<button  class="operator">/</button>

<button  class="butt ">7</button>
<button  class="butt ">8</button>
<button  class="butt ">9</button>
<button  class="operator">*</button>

<button  class="butt ">4</button>
<button  class="butt ">5</button>
<button  class="butt ">6</button>
<button  class="operator">-</button>

<button  class="butt"  >1</button>
<button  class="butt"  >2</button>
<button  class="butt"  >3</button>
<button  class=" operator">+</button>

<button  class="butt ">0</button>
<button  class="butt">.</button>
<button  class="action" style="grid-column: span 2;">=</button>

</div>        
      </div>

    
    <script src="app.js"></script>
   
</body>
</html>
